name: Check for new grad job postings

on:
  schedule:
    # Every 7 minutes. GitHub Actions schedules can be delayed under load,
    # especially on low-activity repos, so treat this as "at least every ~10-15 min"
    # rather than an exact guarantee.
    - cron: "*/7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json latest_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job snapshot [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
